[project]
name = "mail-portal"
version = "0.1.0"
description = "Outlook mailbox archive and token-gated message viewer"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=43,<45",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "pillow>=10,<12",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.alembic]
# The runtime database URL is supplied via MAIL_PORTAL_DATABASE_URL.
