<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/static/style.css?v=20260802-theme">
  <title>邮件访问验证</title>
</head>
<body>
  <div class="page-shell narrow">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 5 8-5"/></svg>
        </div>
        <div class="brand-copy"><p class="brand-title">隐私邮件查看</p><p class="brand-subtitle">受保护的邮件正文入口</p></div>
      </div>
      <span class="status-chip">安全验证</span>
    </header>

    <main class="auth-layout">
      <section class="glass-panel auth-card captcha-card">
        <div class="auth-heading">
          <div class="auth-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M9 15h.01M12 15h.01M15 15h.01"/></svg>
          </div>
          <p class="eyebrow">Access verification</p>
          <h1>验证后查看邮件</h1>
          <p class="lead">请输入图片中的 4 位字母或数字，验证成功后即可查看对应正文。</p>
        </div>
        {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
        <div class="captcha-box">
          <img src="/m/{{ token }}/captcha.svg" alt="验证码" width="180" height="60">
          <p class="muted small">验证码有效期有限，请按图片准确输入。</p>
        </div>
        <form class="form-stack" method="post" action="/m/{{ token }}/verify" autocomplete="off">
          <div class="field">
            <label for="answer">验证码</label>
            <input class="input captcha-input" id="answer" name="answer" maxlength="4" minlength="4" inputmode="text" autocomplete="off" required autofocus>
          </div>
          <button class="btn btn-primary btn-block" type="submit">继续查看</button>
        </form>
        <p class="page-note">此链接仅用于查看对应隐私邮箱的匹配邮件。</p>
      </section>
    </main>
  </div>
</body>
</html>
