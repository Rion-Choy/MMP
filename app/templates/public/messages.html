<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="/static/style.css?v=20260805-mail-features">
  <title>邮件正文</title>
</head>
<body>
  <div class="page-shell wide">
    <header class="site-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 5 8-5"/></svg></div>
        <div class="brand-copy"><p class="brand-title">隐私邮件查看</p><p class="brand-subtitle">邮件正文归档</p></div>
      </div>
      <span class="status-chip">已验证</span>
    </header>

    <main class="public-content">
      <section class="glass-panel card">
        <div class="section-heading">
          <div><p class="eyebrow">Mailbox archive</p><h1>匹配邮件</h1><p class="lead">以下内容为对应收件人或抄送地址匹配的邮件正文。</p></div>
          <span class="matched-mailbox"><span>匹配邮箱</span><strong>{{ target_email }}</strong></span>
          <div class="public-actions">
            <label class="auto-refresh-control" id="auto-refresh-toggle" for="auto-refresh-interval"><span>自动刷新</span><select class="select" id="auto-refresh-interval" aria-label="自动刷新间隔"><option value="0">不刷新</option><option value="10">10 秒</option><option value="20">20 秒</option><option value="30">30 秒</option></select></label>
            <button class="btn btn-primary" id="refresh-messages" type="button" data-refresh-url="/m/{{ token }}/refresh?page={{ page }}" aria-controls="messages-content" aria-busy="false"><span class="refresh-icon" aria-hidden="true">↻</span><span class="refresh-label">刷新</span></button>
            <span class="status-pill">安全连接</span>
          </div>
        </div>
      </section>

      <div id="refresh-captcha-host" hidden></div>
      <div id="messages-content">
        {% include "public/_messages_content.html" %}
      </div>
    </main>
  </div>
  <script src="/static/public-messages.js?v=20260805-mail-features" defer></script>
</body>
</html>
